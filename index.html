<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Load Planner</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #f43f5e;
            --success: #10b981;
            --font-family: system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Control Panel */
        aside {
            width: 320px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .section-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select, button {
            font-family: inherit;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .time-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Main Workspace Grid */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .calendar-container {
            flex: 1;
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            overflow-y: auto;
            position: relative;
            background-color: var(--bg-color);
        }

        .header-row {
            display: contents;
        }

        .time-header, .day-header {
            background-color: var(--card-bg);
            padding: 12px 8px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .time-slot-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: right;
            padding-right: 8px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            height: 60px;
            position: relative;
            top: -8px;
        }

        .day-column {
            border-right: 1px solid var(--border-color);
            position: relative;
            min-height: 840px; /* 14 hours * 60px */
        }

        .grid-line {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
        }

        /* Task Blocks */
        .task-block {
            position: absolute;
            left: 4px;
            right: 4px;
            background-color: #0284c7;
            border-radius: 4px;
            padding: 6px;
            font-size: 0.8rem;
            overflow: hidden;
            cursor: grab;
            display: flex;
            flex-direction: column;
            gap: 2px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .task-block:active {
            cursor: grabbing;
        }

        .task-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-time {
            font-size: 0.7rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Sidebar Controls -->
    <aside>
        <h1>Weekly Load Planner</h1>
        
        <div class="section-group">
            <label for="taskName">Task Name</label>
            <input type="text" id="taskName" placeholder="e.g., Circuit Analysis Lab">
        </div>

        <div class="section-group">
            <label for="taskDay">Day</label>
            <select id="taskDay">
                <option value="0">Monday</option>
                <option value="1">Tuesday</option>
                <option value="2">Wednesday</option>
                <option value="3">Thursday</option>
                <option value="4">Friday</option>
                <option value="5">Saturday</option>
                <option value="6">Sunday</option>
            </select>
        </div>

        <div class="section-group">
            <label>Time Window (08:00 - 22:00)</label>
            <div class="time-row">
                <input type="time" id="taskFromTime" min="08:00" max="22:00" value="09:00" required>
                <input type="time" id="taskToTime" min="08:00" max="22:00" value="10:00" required>
            </div>
        </div>

        <button id="addBtn">Add Task</button>
    </aside>

    <!-- Main Grid -->
    <main>
        <div class="calendar-container" id="calendarContainer">
            <!-- Headers and columns generated dynamically via script -->
        </div>
    </main>

    <script>
        const AUTO_START_HOUR = 8;
        const AUTO_END_HOUR = 22;
        const SLOT_HEIGHT = 60; // 60px per hour
        const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

        let tasks = [
            { id: 1, name: "Lab Session", day: 0, from: "09:00", to: "11:30" }
        ];

        function timeToDecimal(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours + minutes / 60;
        }

        function validateTimeWindow(fromTime, toTime) {
            const minTime = "08:00";
            const maxTime = "22:00";

            if (fromTime < minTime || toTime > maxTime) {
                alert("Tasks must fall strictly within the auto-schedule window (08:00 to 22:00)[span_0](start_span)[span_0](end_span).");
                return false;
            }
            if (fromTime >= toTime) {
                alert("The 'From' time must precede the 'To' time.");
                return false;
            }
            return true;
        }

        function renderGrid() {
            const container = document.getElementById('calendarContainer');
            container.innerHTML = '';

            // Top-left blank corner
            const topLeft = document.createElement('div');
            topLeft.className = 'time-header';
            container.appendChild(topLeft);

            // Day Headers
            DAYS.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.innerText = day;
                container.appendChild(dayHeader);
            });

            // Time Slots & Columns
            for (let hour = AUTO_START_HOUR; hour < AUTO_END_HOUR; hour++) {
                const timeLabel = document.createElement('div');
                timeLabel.className = 'time-slot-label';
                timeLabel.innerText = `${hour.toString().padStart(2, '0')}:00`;
                container.appendChild(timeLabel);

                for (let dayIdx = 0; dayIdx < 7; dayIdx++) {
                    const slotCell = document.createElement('div');
                    slotCell.className = 'grid-line';
                    container.appendChild(slotCell);
                }
            }

            // Render Task Blocks over columns
            // To position properly, we append columns or absolute overlays. Let's create columns representation.
            // Simplified implementation: Attach columns directly.
            buildColumns(container);
        }

        function buildColumns(container) {
            // Re-structure layout precisely matching absolute columns overlay
            container.innerHTML = '';
            
            // Render Hour Labels column
            const timeCol = document.createElement('div');
            for (let hour = AUTO_START_HOUR; hour < AUTO_END_HOUR; hour++) {
                const label = document.createElement('div');
                label.className = 'time-slot-label';
                label.innerText = `${hour.toString().padStart(2, '0')}:00`;
                timeCol.appendChild(label);
            }
            container.appendChild(timeCol);

            // Render 7 Day columns
            DAYS.forEach((dayName, dayIdx) => {
                const col = document.createElement('div');
                col.className = 'day-column';
                col.dataset.day = dayIdx;

                for (let hour = AUTO_START_HOUR; hour < AUTO_END_HOUR; hour++) {
                    const line = document.createElement('div');
                    line.className = 'grid-line';
                    col.appendChild(line);
                }

                // Append tasks belonging to this day
                tasks.filter(t => t.day === dayIdx).forEach(task => {
                    const block = document.createElement('div');
                    block.className = 'task-block';

                    const startDec = timeToDecimal(task.from);
                    const endDec = timeToDecimal(task.to);

                    const topOffset = (startDec - AUTO_START_HOUR) * SLOT_HEIGHT;
                    const height = (endDec - startDec) * SLOT_HEIGHT;

                    block.style.top = `${topOffset}px`;
                    block.style.height = `${Math.max(height, 20)}px`;

                    block.innerHTML = `
                        <div class="task-title">${task.name}</div>
                        <div class="task-time">${task.from} - ${task.to}</div>
                    `;

                    col.appendChild(block);
                });

                container.appendChild(col);
            });
        }

        document.getElementById('addBtn').addEventListener('click', () => {
            const name = document.getElementById('taskName').value.trim();
            const day = parseInt(document.getElementById('taskDay').value);
            const from = document.getElementById('taskFromTime').value;
            const to = document.getElementById('taskToTime').value;

            if (!name) {
                alert("Please provide a task name.");
                return;
            }

            if (!validateTimeWindow(from, to)) {
                return;
            }

            tasks.push({ id: Date.now(), name, day, from, to });
            renderGrid();

            // Clear name input
            document.getElementById('taskName').value = '';
        });

        // Initial render
        renderGrid();
    </script>
</body>
</html>
